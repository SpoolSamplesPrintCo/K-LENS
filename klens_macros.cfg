#####################################################################
# KLENS v0.11.4.2: FULL RESTORATION | BEAUTY-FIRST | CASE-AGNOSTIC
#####################################################################
# Dev: J | System: G | Optimization: OrcaSlicer Capable
#####################################################################

[gcode_shell_command klens_engine]
command: bash /home/biqu/printer_data/config/klens/scripts/klens_engine.sh
timeout: 5.0
verbose: True

[gcode_macro _KLENS_VARS]
# --- BEAUTY DEFAULTS (The Idle/Standard Look) ---
variable_current_bias: -280
variable_current_con: 54
variable_current_bright: 124
variable_current_wb: 4000
variable_current_gain: 0
variable_current_sat: 50
variable_current_tint: 50
variable_current_sharp: 3

# --- WHITE FILAMENT VARIANCES (Offsets to drop from Beauty) ---
variable_white_offset_bias: -120    # Target Result: -400
variable_white_offset_con: -9       # Target Result: 45
variable_white_offset_sharp: -2     # Target Result: 1
variable_black_mode_active: 1      # 1=Beauty (Black), 0=White
gcode:

#####################################################################
# AUTOMATION & TOGGLES
#####################################################################

[gcode_macro K_LENS_AUTO_PROFILE]
description: Case-agnostic detection for White (FFFFFF).
gcode:
    # Convert filename to lowercase to catch OrcaSlicer's ALL CAPS
    {% set filename = printer.print_stats.filename|string|lower %}
    
    {% if "ffffff" in filename %}
        {action_respond_info("KLENS: White Hex (FFFFFF) Detected. Applying Offsets.")}
        KLENS_WHITE_BASE
    {% else %}
        {action_respond_info("KLENS: No White Hex detected. Staying in Beauty Mode.")}
        KLENS_BLACK_BASE
    {% endif %}

[gcode_macro KLENS_TOGGLE_BLACK]
description: Manually toggle between White and Beauty profiles.
gcode:
    {% if printer["gcode_macro _KLENS_VARS"].black_mode_active|int == 0 %}
        KLENS_BLACK_BASE
    {% else %}
        KLENS_WHITE_BASE
    {% endif %}

#####################################################################
# ROW 1: SYSTEM & MODES
#####################################################################

[gcode_macro KLENS_STATUS]
description: View current KLENS Calibration Report.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="status"

[gcode_macro KLENS_COLOR_SYNC]
description: Toggle Auto-Color fields. 1=Auto, 0=Manual.
gcode:
    {% set ac = params.AUTO_COLOR|default(1)|int %}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_color {ac}"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_hue 1"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_sat 1"

[gcode_macro KLENS_EXP_MODE]
description: Toggle Exposure. MODE=1 (Auto), MODE=0 (Manual).
gcode:
    {% set m = params.MODE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_exp {m}"

#####################################################################
# ROW 2 & 3: EXPOSURE & GAIN
#####################################################################

[gcode_macro KLENS_EXP_DN]
description: Decrease Exposure Bias (Darker).
gcode:
    {% set bias = printer["gcode_macro _KLENS_VARS"].current_bias|int %}
    {% set new_bias = bias - params.VALUE|default(20)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={new_bias}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias {new_bias}"

[gcode_macro KLENS_EXP_UP]
description: Increase Exposure Bias (Brighter).
gcode:
    {% set bias = printer["gcode_macro _KLENS_VARS"].current_bias|int %}
    {% set new_bias = bias + params.VALUE|default(20)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={new_bias}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias {new_bias}"

[gcode_macro KLENS_GAIN_DN]
description: Decrease sensor Gain.
gcode:
    {% set g = printer["gcode_macro _KLENS_VARS"].current_gain|int %}
    {% set new_g = g - params.VALUE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE={new_g}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain {new_g}"

[gcode_macro KLENS_GAIN_UP]
description: Increase sensor Gain.
gcode:
    {% set g = printer["gcode_macro _KLENS_VARS"].current_gain|int %}
    {% set new_g = g + params.VALUE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE={new_g}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain {new_g}"

#####################################################################
# ROW 4 & 5: FIDELITY (BRIGHT, SAT, CON, SHARP)
#####################################################################

[gcode_macro KLENS_BRIGHT_DN]
description: Decrease Digital Brightness.
gcode:
    {% set br = printer["gcode_macro _KLENS_VARS"].current_bright|int %}
    {% set new_br = br - params.VALUE|default(10)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE={new_br}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness {new_br}"

[gcode_macro KLENS_BRIGHT_UP]
description: Increase Digital Brightness.
gcode:
    {% set br = printer["gcode_macro _KLENS_VARS"].current_bright|int %}
    {% set new_br = br + params.VALUE|default(10)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE={new_br}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness {new_br}"

[gcode_macro KLENS_SAT_DN]
description: Decrease Color Saturation.
gcode:
    {% set sat = printer["gcode_macro _KLENS_VARS"].current_sat|int %}
    {% set new_sat = sat - params.VALUE|default(5)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sat VALUE={new_sat}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="saturation {new_sat}"

[gcode_macro KLENS_SAT_UP]
description: Increase Color Saturation.
gcode:
    {% set sat = printer["gcode_macro _KLENS_VARS"].current_sat|int %}
    {% set new_sat = sat + params.VALUE|default(5)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sat VALUE={new_sat}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="saturation {new_sat}"

[gcode_macro KLENS_CON_DN]
description: Decrease Image Contrast.
gcode:
    {% set con = printer["gcode_macro _KLENS_VARS"].current_con|int %}
    {% set new_con = con - params.VALUE|default(5)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE={new_con}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast {new_con}"

[gcode_macro KLENS_CON_UP]
description: Increase Image Contrast.
gcode:
    {% set con = printer["gcode_macro _KLENS_VARS"].current_con|int %}
    {% set new_con = con + params.VALUE|default(5)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE={new_con}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast {new_con}"

[gcode_macro KLENS_SHARP_DN]
description: Decrease Image Sharpness.
gcode:
    {% set sh = printer["gcode_macro _KLENS_VARS"].current_sharp|int %}
    {% set new_sh = sh - params.VALUE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE={new_sh}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness {new_sh}"

[gcode_macro KLENS_SHARP_UP]
description: Increase Image Sharpness.
gcode:
    {% set sh = printer["gcode_macro _KLENS_VARS"].current_sharp|int %}
    {% set new_sh = sh + params.VALUE|default(1)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE={new_sh}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness {new_sh}"

#####################################################################
# WHITE BALANCE & TINT
#####################################################################

[gcode_macro KLENS_WB_DN]
description: Decrease White Balance (Cooler).
gcode:
    {% set wb = printer["gcode_macro _KLENS_VARS"].current_wb|int %}
    {% set new_wb = wb - params.VALUE|default(200)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_wb VALUE={new_wb}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="white_balance {new_wb}"

[gcode_macro KLENS_WB_UP]
description: Increase White Balance (Warmer).
gcode:
    {% set wb = printer["gcode_macro _KLENS_VARS"].current_wb|int %}
    {% set new_wb = wb + params.VALUE|default(200)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_wb VALUE={new_wb}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="white_balance {new_wb}"

[gcode_macro KLENS_TINT_DN]
description: Decrease Image Tint.
gcode:
    {% set t = printer["gcode_macro _KLENS_VARS"].current_tint|int %}
    {% set new_t = t - params.VALUE|default(5)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_tint VALUE={new_t}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="tint {new_t}"

[gcode_macro KLENS_TINT_UP]
description: Increase Image Tint.
gcode:
    {% set t = printer["gcode_macro _KLENS_VARS"].current_tint|int %}
    {% set new_t = t + params.VALUE|default(5)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_tint VALUE={new_t}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="tint {new_t}"

#####################################################################
# FOOTER & RECOVERY
#####################################################################

[gcode_macro KLENS_FULL_AUTO]
description: Set all camera values to Auto.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_exp 1"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_color 1"

[gcode_macro KLENS_SAVE]
description: Permanently save current settings to engine config.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="save"

[gcode_macro KLENS_RESTART]
description: Restart the KLENS camera engine.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="restart"

[gcode_macro KLENS_BLACK_BASE]
description: Restore Beauty/Black Baseline (-280).
gcode:
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE=-280
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE=0
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE=54
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE=124
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE=3
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=1
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias -280 gain 0 contrast 54 brightness 124 sharpness 3"
    {action_respond_info("KLENS: Beauty (Black) Baseline Restored.")}
    KLENS_STATUS

[gcode_macro KLENS_WHITE_BASE]
description: Apply White Material Offsets (Drops to -400).
gcode:
    # 1. Reset to Beauty Defaults first
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE=-280
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE=54
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE=3
    
    # 2. Grab White Offsets
    {% set off_bias = printer["gcode_macro _KLENS_VARS"].white_offset_bias|int %}
    {% set off_con = printer["gcode_macro _KLENS_VARS"].white_offset_con|int %}
    {% set off_sharp = printer["gcode_macro _KLENS_VARS"].white_offset_sharp|int %}
    
    # 3. Apply the shift
    KLENS_EXP_UP VALUE={off_bias}
    KLENS_CON_UP VALUE={off_con}
    KLENS_SHARP_UP VALUE={off_sharp}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=0
    {action_respond_info("KLENS: White Offset Applied.")}
    KLENS_STATUS
