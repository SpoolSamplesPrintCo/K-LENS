#####################################################################
# PROFILES
#####################################################################

[gcode_macro KLENS_BLACK_BASE]
description: Restore Beauty Profile (-280).
gcode:
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE=-280
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE=54
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE=3
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=1
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias -280 contrast 54 sharpness 3"

[gcode_macro KLENS_WHITE_BASE]
description: Apply White Filament Offsets (-400).
gcode:
    KLENS_BLACK_BASE
    {% set off_bias = printer["gcode_macro _KLENS_VARS"].white_offset_bias|int %}
    {% set off_con = printer["gcode_macro _KLENS_VARS"].white_offset_con|int %}
    {% set off_sharp = printer["gcode_macro _KLENS_VARS"].white_offset_sharp|int %}
    KLENS_EXP_UP VALUE={off_bias}
    KLENS_CON_UP VALUE={off_con}
    KLENS_SHARP_UP VALUE={off_sharp}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=0
