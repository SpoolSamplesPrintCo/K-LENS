#####################################################################
# K-LENS v0.11.4.0: BEAUTY-DEFAULT | HEX-DETECTION | HYBRID TOGGLE
#####################################################################

[gcode_shell_command klens_engine]
command: bash /home/biqu/printer_data/config/klens/scripts/klens_engine.sh
timeout: 5.0
verbose: True

[gcode_macro _KLENS_VARS]
variable_current_bias: -280
variable_current_con: 45
variable_current_bright: 124
variable_current_wb: 4000
variable_current_gain: 0
variable_current_sat: 50
variable_current_tint: 50
variable_current_sharp: 1
variable_black_offset_bias: 120
variable_black_offset_con: 9
variable_black_offset_sharp: 2
variable_black_mode_active: 0
gcode:

[gcode_macro K_LENS_AUTO_PROFILE]
description: Detects Hex FFFFFF in filename to apply White Offsets.
gcode:
    {% set filename = printer.print_stats.filename|string|lower %}
    {% if "ffffff" in filename %}
        {action_respond_info("K-LENS: White Hex (ffffff) Detected. Dropping Exposure.")}
        KLENS_WHITE_BASE
    {% else %}
        {action_respond_info("K-LENS: Standard Material Detected. Using Beauty Baseline.")}
        KLENS_BEAUTY_BASE
    {% endif %}

[gcode_macro KLENS_TOGGLE_BLACK]
description: Cycle between Beauty (-280) and White (-400) Profiles.
gcode:
    {% if printer["gcode_macro _KLENS_VARS"].current_bias|int == -280 %}
        {action_respond_info("K-LENS: Toggling to White Baseline.")}
        KLENS_WHITE_BASE
    {% else %}
        {action_respond_info("K-LENS: Toggling to Beauty Baseline.")}
        KLENS_BEAUTY_BASE
    {% endif %}

[gcode_macro KLENS_BEAUTY_BASE]
description: Apply the cinematic -280 Beauty Baseline.
gcode:
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE=-280
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE=0
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE=45
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE=124
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE=1
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=0
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias -280"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain 0"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast 45"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness 124"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness 1"
    {action_respond_info("K-LENS: Beauty Baseline (-280) Applied.")}
    KLENS_STATUS

[gcode_macro KLENS_WHITE_BASE]
description: Apply the high-reflective -400 White Baseline.
gcode:
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE=-400
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE=0
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE=45
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE=124
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE=1
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=0
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias -400"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain 0"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast 45"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness 124"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness 1"
    {action_respond_info("K-LENS: White Baseline (-400) Restored.")}
    KLENS_STATUS

[gcode_macro KLENS_BLACK_BASE]
description: Apply Black Offsets on top of White Baseline.
gcode:
    {% set off_bias = printer["gcode_macro _KLENS_VARS"].black_offset_bias|int %}
    {% set off_con = printer["gcode_macro _KLENS_VARS"].black_offset_con|int %}
    {% set off_sharp = printer["gcode_macro _KLENS_VARS"].black_offset_sharp|int %}
    KLENS_WHITE_BASE
    KLENS_EXP_UP VALUE={off_bias}
    KLENS_CON_UP VALUE={off_con}
    KLENS_SHARP_UP VALUE={off_sharp}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=1
    {action_respond_info("K-LENS: Black Offset Applied to White Base.")}
    KLENS_STATUS

[gcode_macro KLENS_STATUS]
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="status"

[gcode_macro KLENS_SAVE]
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="save"

[gcode_macro KLENS_RESTART]
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="restart"

# --- CALIBRATION STEP CONTROLS ---

[gcode_macro KLENS_EXP_DN]
gcode:
    {% set bias = printer["gcode_macro _KLENS_VARS"].current_bias|int %}
    {% set new_bias = bias - params.VALUE|default(20)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={new_bias}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias {new_bias}"

[gcode_macro KLENS_EXP_UP]
gcode:
    {% set bias = printer["gcode_macro _KLENS_VARS"].current_bias|int %}
