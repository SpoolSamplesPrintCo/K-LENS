#####################################################################
# KLENS v0.11.4.11: FULL SUITE | HARDWARE UNLOCK | DROP-IN
#####################################################################

[gcode_shell_command klens_engine]
command: bash /home/biqu/printer_data/config/klens/scripts/klens_engine.sh
timeout: 5.0
verbose: True

[gcode_macro _KLENS_VARS]
variable_current_bias: -280
variable_current_con: 54
variable_current_bright: 124
variable_current_wb: 4000
variable_current_gain: 0
variable_current_sat: 50
variable_current_tint: 50
variable_current_sharp: 3
variable_white_offset_bias: -120 
variable_white_offset_con: -9    
variable_white_offset_sharp: -2  
variable_black_mode_active: 1    
gcode:

#####################################################################
# MASTER CONTROLS
#####################################################################

[gcode_macro KLENS_STATUS]
description: Report current camera settings and hardware state.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="status"

[gcode_macro KLENS_SAVE]
description: Save all current hardware values to klens_config.ini.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="save"

[gcode_macro KLENS_FULL_AUTO]
description: Unlock hardware and force Full Auto Exposure/Color.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_exp 1 auto_color 1"

#####################################################################
# ADJUSTMENTS (IMAGE DYNAMICS)
#####################################################################

[gcode_macro KLENS_EXP_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bias|int + 20 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias {val}"

[gcode_macro KLENS_EXP_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bias|int - 20 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias {val}"

[gcode_macro KLENS_GAIN_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_gain|int + 1 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain {val}"

[gcode_macro KLENS_GAIN_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_gain|int - 1 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain {val}"

[gcode_macro KLENS_BRIGHT_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bright|int + 10 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness {val}"

[gcode_macro KLENS_BRIGHT_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bright|int - 10 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness {val}"

[gcode_macro KLENS_CON_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_con|int + 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast {val}"

[gcode_macro KLENS_CON_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_con|int - 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast {val}"

