#####################################################################
# K-LENS v0.11.4.0: PUBLIC DEV | BEAUTY DEFAULT | HEX-DETECTION
#####################################################################
# Repo: SpoolSamplesPrintCo/K-LENS
#####################################################################

[gcode_shell_command klens_engine]
command: bash /home/biqu/printer_data/config/klens/scripts/klens_engine.sh
timeout: 5.0
verbose: True

[gcode_macro _KLENS_VARS]
# --- BEAUTY DEFAULTS (v0.11.4.0) ---
# This is the "Punchy" look J prefers for idle/standard prints
variable_current_bias: -280
variable_current_con: 54
variable_current_bright: 124
variable_current_wb: 4000
variable_current_gain: 0
variable_current_sat: 50
variable_current_tint: 50
variable_current_sharp: 3

# --- WHITE FILAMENT OFFSETS (To drop from Beauty) ---
variable_white_offset_bias: -120    # Result: -400
variable_white_offset_con: -9       # Result: 45
variable_white_offset_sharp: -2     # Result: 1
variable_black_mode_active: 1      # 1=Beauty Mode is ON by default
gcode:

#####################################################################
# AUTOMATION: THE BEAUTY DEFAULT
#####################################################################

[gcode_macro K_LENS_AUTO_PROFILE]
description: Scans for White (#FFFFFF). Otherwise, stays in Beauty Mode.
gcode:
    {% set filename = printer.print_stats.filename|string|lower %}
    
    {% if "ffffff" in filename %}
        {action_respond_info("KLENS: White Filament Detected. Using White Profile.")}
        KLENS_WHITE_BASE
    {% else %}
        {action_respond_info("KLENS: No White Hex detected. Using Beauty Profile.")}
        KLENS_BLACK_BASE
    {% endif %}

[gcode_macro KLENS_TOGGLE_BLACK]
description: Manually toggle between White and Black profiles.
gcode:
    {% if printer["gcode_macro _KLENS_VARS"].black_mode_active|int == 0 %}
        KLENS_BLACK_BASE
    {% else %}
        KLENS_WHITE_BASE
    {% endif %}

#####################################################################
# CORE ENGINE COMMANDS
#####################################################################

[gcode_macro KLENS_STATUS]
gcode: RUN_SHELL_COMMAND CMD=klens_engine PARAMS="status"

[gcode_macro KLENS_SAVE]
gcode: RUN_SHELL_COMMAND CMD=klens_engine PARAMS="save"

[gcode_macro KLENS_RESTART]
gcode: RUN_SHELL_COMMAND CMD=klens_engine PARAMS="restart"

#####################################################################
# PROFILE BASES
#####################################################################

[gcode_macro KLENS_BLACK_BASE]
description: Apply Black/Beauty Profile (-280 Bias).
gcode:
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE=-280
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE=54
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE=3
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=1
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias -280"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast 54"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness 3"
    {action_respond_info("K-LENS: Beauty Profile Applied.")}

[gcode_macro KLENS_WHITE_BASE]
description: Apply White Filament Profile (-400 Bias).
gcode:
    {% set off_bias = printer["gcode_macro _KLENS_VARS"].white_offset_bias|int %}
    {% set off_con = printer["gcode_macro _KLENS_VARS"].white_offset_con|int %}
    {% set off_sharp = printer["gcode_macro _KLENS_VARS"].white_offset_sharp|int %}
    
    # Start from Beauty, then subtract
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={-280 + off_bias}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE={54 + off_con}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE={3 + off_sharp}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=0
    
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias -400"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast 45"
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness 1"
    {action_respond_info("K-LENS: White Baseline Applied.")}
