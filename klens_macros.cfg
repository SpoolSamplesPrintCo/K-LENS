#####################################################################
# KLENS v0.11.4.10: FULL SUITE | HARDWARE UNLOCK | DROP-IN
#####################################################################
# Developer: J (@SpoolSamplesPrintCo) | Assistant: Gemini
#####################################################################

[gcode_shell_command klens_engine]
command: bash /home/biqu/printer_data/config/klens/scripts/klens_engine.sh
timeout: 5.0
verbose: True

[gcode_macro _KLENS_VARS]
variable_current_bias: -280
variable_current_con: 54
variable_current_bright: 124
variable_current_wb: 4000
variable_current_gain: 0
variable_current_sat: 50
variable_current_tint: 50
variable_current_sharp: 3
variable_white_offset_bias: -120 
variable_white_offset_con: -9    
variable_white_offset_sharp: -2  
variable_black_mode_active: 1    
gcode:

#####################################################################
# ROW 1: MASTER CONTROLS & STATUS
#####################################################################

[gcode_macro KLENS_STATUS]
description: Report current camera settings and hardware state.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="status"

[gcode_macro KLENS_SAVE]
description: Save all current hardware values to klens_config.ini.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="save"

[gcode_macro KLENS_RESTART]
description: Force restart the camera service.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="restart"

[gcode_macro KLENS_FULL_AUTO]
description: Unlock hardware and force Full Auto Exposure/Color.
gcode:
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_exp 1 auto_color 1"
    {action_respond_info("KLENS: Full Auto Mode Enabled")}

#####################################################################
# ROW 2: PROFILES & MODES
#####################################################################

[gcode_macro K_LENS_AUTO_PROFILE]
description: Scans filename for White Hex FFFFFF. Case-Agnostic.
gcode:
    {% set filename = printer.print_stats.filename|string|lower %}
    {% if "ffffff" in filename %}
        {action_respond_info("KLENS: White Hex Detected. Applying Offsets.")}
        KLENS_WHITE_BASE
    {% else %}
        {action_respond_info("KLENS: No White Hex detected. Using Beauty Baseline.")}
        KLENS_BLACK_BASE
    {% endif %}

[gcode_macro KLENS_TOGGLE_BLACK]
description: Toggle between White (-400) and Beauty (-280) profiles.
gcode:
    {% if printer["gcode_macro _KLENS_VARS"].black_mode_active|int == 0 %}
        KLENS_BLACK_BASE
    {% else %}
        KLENS_WHITE_BASE
    {% endif %}

[gcode_macro KLENS_COLOR_SYNC]
description: Toggle Auto-White Balance (1=On, 0=Manual).
gcode:
    {% set ac = params.AUTO_COLOR|default(1)|int %}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_color {ac}"

[gcode_macro KLENS_EXP_MODE]
description: Toggle Auto-Exposure (1=On, 0=Manual).
gcode:
    {% set m = params.MODE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="auto_exp {m}"

#####################################################################
# ROW 3: EXPOSURE & GAIN (IMAGE BRIGHTNESS)
#####################################################################

[gcode_macro KLENS_EXP_UP]
description: Brighter (+) | Adjusts Exposure Bias.
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bias|int + params.VALUE|default(20)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias {val}"

[gcode_macro KLENS_EXP_DN]
description: Darker (-) | Adjusts Exposure Bias.
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bias|int - params.VALUE|default(20)|int %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias {val}"

[gcode_macro KLENS_GAIN_UP]
description: Increase sensor Gain.
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_gain|int + 1 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain {val}"

[gcode_macro KLENS_GAIN_DN]
description: Decrease sensor Gain.
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_gain|int - 1 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_gain VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="gain {val}"

#####################################################################
# ROW 4: FIDELITY (BRIGHT, CON, SHARP)
#####################################################################

[gcode_macro KLENS_BRIGHT_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bright|int + 10 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness {val}"

[gcode_macro KLENS_BRIGHT_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_bright|int - 10 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bright VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="brightness {val}"

[gcode_macro KLENS_CON_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_con|int + 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast {val}"

[gcode_macro KLENS_CON_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_con|int - 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="contrast {val}"

[gcode_macro KLENS_SHARP_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_sharp|int + 1 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness {val}"

[gcode_macro KLENS_SHARP_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_sharp|int - 1 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="sharpness {val}"

#####################################################################
# ROW 5: COLOR TUNING (SAT, TINT, WB)
#####################################################################

[gcode_macro KLENS_SAT_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_sat|int + 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sat VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="saturation {val}"

[gcode_macro KLENS_SAT_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_sat|int - 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sat VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="saturation {val}"

[gcode_macro KLENS_TINT_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_tint|int + 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_tint VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="hue {val}"

[gcode_macro KLENS_TINT_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_tint|int - 5 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_tint VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="hue {val}"

[gcode_macro KLENS_WB_UP]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_wb|int + 200 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_wb VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="white_balance_temperature {val}"

[gcode_macro KLENS_WB_DN]
gcode:
    {% set val = printer["gcode_macro _KLENS_VARS"].current_wb|int - 200 %}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_wb VALUE={val}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="white_balance_temperature {val}"

#####################################################################
# BASELINE PROFILES
#####################################################################

[gcode_macro KLENS_BLACK_BASE]
description: Restore Beauty Profile (-280).
gcode:
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_bias VALUE=-280
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_con VALUE=54
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=current_sharp VALUE=3
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=1
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="bias -280 contrast 54 sharpness 3"
    {action_respond_info("KLENS: Beauty Profile Active")}

[gcode_macro KLENS_WHITE_BASE]
description: Apply White Filament Offsets (-400).
gcode:
    KLENS_BLACK_BASE
    {% set off_bias = printer["gcode_macro _KLENS_VARS"].white_offset_bias|int %}
    {% set off_con = printer["gcode_macro _KLENS_VARS"].white_offset_con|int %}
    {% set off_sharp = printer["gcode_macro _KLENS_VARS"].white_offset_sharp|int %}
    KLENS_EXP_UP VALUE={off_bias}
    KLENS_CON_UP VALUE={off_con}
    KLENS_SHARP_UP VALUE={off_sharp}
    SET_GCODE_VARIABLE MACRO=_KLENS_VARS VARIABLE=black_mode_active VALUE=0
    {action_respond_info("KLENS: White Profile Active")}
