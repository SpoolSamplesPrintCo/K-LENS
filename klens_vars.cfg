[gcode_macro _KLENS_VARIABLES]
# --- K-LENS SYSTEM VARIABLES ---
variable_verbose: True
variable_mode: "ADAPTIVE"          # ADAPTIVE or MANUAL
variable_solar_scale: 0.0          # 0.0 to 1.0
variable_exposure: 450             # New brighter daytime floor
variable_bias: 150                 # Significant boost for night
variable_gain: 10
variable_wb: 4600
variable_brightness: 0
gcode:
    # Required empty gcode block

[gcode_macro KLENS_STATUS]
gcode:
    {% set v = printer["gcode_macro _KLENS_VARIABLES"] %}
    { action_respond_info("--- K-LENS SYSTEM STATUS ---") }
    { action_respond_info("Mode: " ~ v.mode|string) }
    { action_respond_info("Solar Scale: " ~ v.solar_scale|default(0.0)|string ~ " (Fade Multiplier)") }
    { action_respond_info("Exposure: " ~ v.exposure|default(150)|string) }
    { action_respond_info("Bias: " ~ v.bias|default(0)|string) }
    { action_respond_info("Gain: " ~ v.gain|default(0)|string) }
    { action_respond_info("WB Temp: " ~ v.wb|default(4600)|string) }
    { action_respond_info("Brightness: " ~ v.brightness|default(0)|string) }
    { action_respond_info("Verbose: " ~ v.verbose|string) }
    { action_respond_info("---------------------------") }
