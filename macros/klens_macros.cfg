# K-LENS: Klipper Logic-Enhanced Native Sight Macro Suite
# Camera-Control Macros for SV08 / Mainline Klipper

[gcode_shell_command klens_engine]
command: sh /home/biqu/printer_data/config/scripts/klens_engine.sh
timeout: 5.0
verbose: True

[gcode_macro LENS_ADAPTIVE]
description: K-LENS: Activate Adaptive Camera-Control (Daylight/Bias)
gcode:
    {% set val = params.VALUE|default(0)|int %}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="adaptive {val}"
    RESPOND MSG="🔎 K-LENS // Mode: ADAPTIVE (Brightness Nudge: {val})"

[gcode_macro LENS_MANUAL]
description: K-LENS: Activate Manual Camera-Control (Night/Fixed Exposure)
gcode:
    {% set val = params.VALUE|default(150)|int %}
    RUN_SHELL_COMMAND CMD=klens_engine PARAMS="manual {val}"
    RESPOND MSG="🔎 K-LENS // Mode: MANUAL (Fixed Shutter: {val})"
